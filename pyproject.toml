[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ZabbixProto"
version = "2.1.1"
description = "Zabbix Communication Protocols"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [
    { name = "Alen Komic", email = "akomic@gmail.com" },
]
keywords = ["Zabbix", "Protocols", "Sender", "Proxy", "Agent"]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Networking :: Monitoring",
    "Topic :: System :: Systems Administration",
]

[project.urls]
Homepage = "https://github.com/akomic/python-zabbix-proto"
Repository = "https://github.com/akomic/python-zabbix-proto"

[tool.setuptools]
packages = ["zabbixproto"]
